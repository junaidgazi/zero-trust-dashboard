<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zero-Trust Access Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e5e7eb;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }

  .summary { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1;
    min-width: 140px;
  }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .label { font-size: 13px; color: #9ca3af; margin-top: 4px; }
  .card.alert { border-color: #ef4444; }
  .card.alert .value { color: #ef4444; }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #2a2e37;
    font-size: 14px;
  }
  th { color: #9ca3af; font-weight: 600; font-size: 12px; text-transform: uppercase; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.authorized { background: #14532d; color: #4ade80; }
  .badge.unauthorized { background: #7f1d1d; color: #fca5a5; }
  .badge.offline { background: #27272a; color: #a1a1aa; }

  .mac { color: #9ca3af; font-family: monospace; font-size: 12px; }
  .ip { color: #9ca3af; font-family: monospace; }
  .updated { color: #6b7280; font-size: 12px; margin-top: 16px; }
  .row-unauthorized { background: rgba(239, 68, 68, 0.06); }
</style>
</head>
<body>

  <h1>Zero-Trust Access Dashboard</h1>
  <div class="subtitle">Every device must be explicitly trusted - nothing is assumed safe</div>

  <div class="summary">
    <div class="card">
      <div class="value" id="totalOnline">-</div>
      <div class="label">Devices online</div>
    </div>
    <div class="card">
      <div class="value" id="authorizedCount">-</div>
      <div class="label">Authorized</div>
    </div>
    <div class="card alert">
      <div class="value" id="unauthorizedCount">-</div>
      <div class="label">Unauthorized (flagged)</div>
    </div>
    <div class="card">
      <div class="value" id="yourIp">-</div>
      <div class="label">Your IP address</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Device</th>
        <th>IP Address</th>
        <th>MAC Address</th>
        <th>Last Seen</th>
      </tr>
    </thead>
    <tbody id="deviceRows"></tbody>
  </table>

  <div class="updated" id="lastUpdated"></div>

<script>
async function refreshDashboard() {
  try {
    const [summaryRes, devicesRes] = await Promise.all([
      fetch('/api/summary'),
      fetch('/api/devices')
    ]);
    const summary = await summaryRes.json();
    const devices = await devicesRes.json();

    document.getElementById('totalOnline').textContent = summary.total_online;
    document.getElementById('authorizedCount').textContent = summary.authorized_online;
    document.getElementById('unauthorizedCount').textContent = summary.unauthorized_online;
    document.getElementById('yourIp').textContent = summary.your_ip;

    const rows = devices.filter(d => d.status === 'online' || d.mac).map(d => {
      const name = d.device_name || d.hostname || '(unrecognized device)';
      const lastSeen = d.last_seen ? new Date(d.last_seen).toLocaleString() : '-';
      const mac = d.mac || 'unknown';
      let badgeClass, badgeText, rowClass = '';
      if (d.status !== 'online') {
        badgeClass = 'offline'; badgeText = 'offline';
      } else if (d.authorized) {
        badgeClass = 'authorized'; badgeText = 'authorized';
      } else {
        badgeClass = 'unauthorized'; badgeText = 'unauthorized'; rowClass = 'row-unauthorized';
      }
      return `
        <tr class="${rowClass}">
          <td><span class="badge ${badgeClass}">${badgeText}</span></td>
          <td>${name}</td>
          <td class="ip">${d.ip}</td>
          <td class="mac">${mac}</td>
          <td>${lastSeen}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('deviceRows').innerHTML = rows || '<tr><td colspan="5">Scanning...</td></tr>';
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('lastUpdated').textContent = 'Connection error - is the server running?';
  }
}

refreshDashboard();
setInterval(refreshDashboard, 5000);
</script>

</body>
</html>
